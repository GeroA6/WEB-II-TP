name: CI - Integración Continua

on:
  push:
    branches: ["main", "TP3"]
  pull_request:
    branches: ["main", "TP3"]

jobs:
  buil-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      
      - name: Dar permisos de ejecución a mvnw
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias y de integración (Suregire + Failsafe + Testcontainers)
        run: ./mvnw -B verify