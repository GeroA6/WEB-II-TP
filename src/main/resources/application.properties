spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# Conexión a PostgreSQL (con variable de entorno y fallback local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webii_tp2}
spring.datasource.username=${DB_USERNAME:webii_tp2}
spring.datasource.password=${DB_PASSWORD:webii_tp2}

# Configuración de JWT
# Secreto para firmar tokens (mínimo 256 bits para HMAC-SHA256)
app.jwt.secreto=${JWT_SECRET:clave_secreta_super_segura_para_firmar_tokens_jwt_webii_tp3_2026_unvime}
# Tiempo de expiración del token (86400000 ms = 24 horas)
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:86400000}


# Hibernate y control del esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

